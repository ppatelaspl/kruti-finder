# Builds the Windows, macOS (Apple silicon) and Linux installers on real machines.
# Runs on every push to main and on version tags (v1.0.0 -> also publishes a Release).
#
# Supported: Windows 10 (1809+) and 11 | macOS 11+ on Apple silicon |
#            Ubuntu 20.04+, Linux Mint 20+, LMDE 6+, Debian 11+ (64-bit)
name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14            # Apple silicon (arm64)
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: OCR language models
        run: python packaging/fetch_tessdata.py

      # ---- bundle Tesseract
      - name: Tesseract (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          ./packaging/windows/vendor_tesseract.ps1
      - name: Tesseract (macOS)       # built from source: Homebrew's only runs on the runner's macOS
        if: matrix.name == 'macos'
        run: ./packaging/macos/build_tesseract.sh

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/kruti_finder.spec --noconfirm

      # ---- self-test: the packaged app must OCR a Devanagari sample
      - name: Self-test (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\KrutiFinder\KrutiFinder.exe" -ArgumentList "--selftest","selftest.json","packaging\selftest_devanagari.png" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
      - name: Self-test (macOS)
        if: matrix.name == 'macos'
        run: |
          "dist/Kruti Finder.app/Contents/MacOS/KrutiFinder" --selftest selftest.json packaging/selftest_devanagari.png || (cat selftest.json; exit 1)
          cat selftest.json
          # nothing inside the app may need a newer macOS than 11
          find "dist/Kruti Finder.app" -type f \( -perm -u+x -o -name "*.dylib" -o -name "*.so" \) -print0 |
            xargs -0 -n1 sh -c 'v=$(otool -l "$0" 2>/dev/null | awk "/LC_BUILD_VERSION/{f=1} f&&/minos/{print \$2; exit}"); [ -z "$v" ] || echo "$v $0"' |
            awk '{split($1,a,"."); if (a[1] > 11) {print "needs macOS " $0; bad=1}} END {exit bad}'

      # ---- installers
      - name: Installer (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = (Select-String -Path app/version.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" packaging\windows\installer.iss
      - name: Installer (macOS)
        if: matrix.name == 'macos'
        run: ./packaging/macos/build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: KrutiFinder-${{ matrix.name }}
          path: dist/installers/*
          if-no-files-found: error

  # Built on Debian 11 (glibc 2.31) so it also runs on older distros; see build_linux.sh.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app and .deb (Debian 11 container)
        run: docker run --rm -v "$PWD:/src" -w /src python:3.12-slim-bullseye packaging/linux/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KrutiFinder-linux
          path: dist/installers/*
          if-no-files-found: error

  # Install the .deb on each supported distro and open the app there.
  linux-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:20.04, ubuntu:22.04, ubuntu:24.04, ubuntu:26.04,
                linuxmintd/mint20.3-amd64, linuxmintd/mint21.3-amd64, linuxmintd/mint22.2-amd64,
                linuxmintd/lmde6-amd64, debian:12]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KrutiFinder-linux
          path: installers
      - name: Install and run on ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} bash packaging/linux/test_deb.sh installers/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
