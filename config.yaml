# ---------------- Excel input ----------------
excel_sheet: 0                 # sheet index or name
excel_columns:                 # header names; falls back to the first 4 columns
  kruti_no: "कृति क्र."
  name: "कृति परि. नाम"
  aadi: "आदिवाक्य"
  ant: "अंत वा."

# ---------------- Text extraction / OCR ----------------
min_text_chars: 30             # a page's text layer shorter than this is OCR'd
min_indic_ratio: 0.6           # below this share of Gujarati/Devanagari letters the text
                               # layer is treated as a legacy font and the page is OCR'd
max_broken_ratio: 0.02         # above this share of glyph-code letters (broken conjuncts)
                               # the text layer is distrusted and the page is OCR'd
force_ocr: false               # true = ignore text layers entirely
ocr_engine: tesseract          # tesseract | google_vision
tesseract_langs: "hin+guj+san"
tesseract_cmd: ""              # full path to tesseract.exe on Windows, if not on PATH
google_language_hints: ["hi", "gu", "sa"]
ocr_dpi: 300
ocr_workers: 2                 # parallel OCR jobs; ~300-500 MB RAM each
low_ocr_confidence: 70         # Kruti on pages below this get "OCR Quality: Low"
cache_dir: ".kruti_cache"      # OCR results are reused on re-runs

# ---------------- Matching to the Excel ----------------
found_threshold: 85            # match % for a start/end to count as found
min_candidate_score: 65        # weaker hits are ignored
query_max_chars: 160           # longest part of a Vakya used for search
max_kruti_pages: 40            # end must be within this many pages of the start

# ---------------- Kruti detection ----------------
min_verses: 2                  # ignore numbered blocks shorter than this
max_opening_chars: 600         # how far back from verse 1 to take the title and opening
title_keywords: ["स्तवन", "सज्झाय", "स्वाध्याय", "स्तुति", "थोय", "थुई", "चैत्यवंदन", "गीत", "पद",
                 "लावणी", "छंद", "रास", "स्तोत्र", "स्तव", "गहूंली", "गहुंली", "भास", "चोवीसी",
                 "बावनी", "छत्तीसी", "बत्तीसी", "पच्चीसी", "अष्टक", "सूत्र", "आरती", "पूजा", "विनती",
                 "प्रभाती", "सवैया", "कवित्त", "हरियाली", "फेरी", "भगवान"]
                               # a heading line containing one of these starts a new Kruti
section_keywords: ["ढाल", "ढाळ", "दुहा", "दूहा", "दुहो", "दूहो", "दोहा", "दोहरा", "कलश", "सोरठा",
                   "सोरठो", "चोपाई", "चौपाई",
                   "हाल", "हाळ", "टाल", "टाळ", "टाई", "डाल", "डाळ", "डुहा", "डूहा"]
                               # parts inside one Kruti (dhal, doha, kalash; the last row are
                               # OCR misreadings): verse numbers restart there, no new Kruti
duplicate_threshold: 88        # same Kruti in two books/places = one Kruti ID (match %)
